[project]
name = "ot-miniprojekti-ryhma9"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Peetri", email = "petripirinen1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pylint>=4.1.4",
    "pytest>=9.2.0",
]

[project.scripts]
ref = "ot_miniprojekti_ryhma9:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.17.3",
]

[tool.coverage.run]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/ *_test.py"
]